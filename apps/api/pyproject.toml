[project]
name = "prumo-api"
version = "0.1.0"
description = "API principal do Projeto Prumo"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "python-dotenv==1.2.2",
  "supabase==2.31.0",
  "postgrest==2.31.0",
  "storage3==2.31.0",
  "supabase-auth==2.31.0",
  "supabase-functions==2.31.0",
  "realtime==2.31.0",
  "PyJWT==2.13.0",
  "stripe==15.4.0",
]

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-cov"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]