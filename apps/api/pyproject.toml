[project]
name = "prumo-api"
version = "0.1.0"
description = "API principal do Projeto Prumo"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "python-dotenv"
]

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-cov"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]